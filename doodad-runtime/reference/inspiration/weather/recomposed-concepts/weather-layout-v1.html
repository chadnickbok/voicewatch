<script>
(() => {
  const root = document.getElementById('nimbus-layout-v1');
  const grid = root.querySelector('[data-nimbus-grid]');
  const touch = root.querySelector('[data-nimbus-touch]');
  grid.addEventListener('click', () => {
    const active = root.classList.toggle('show-grid');
    grid.setAttribute('aria-pressed', String(active));
  });
  touch.addEventListener('click', () => {
    const active = root.classList.toggle('show-touch');
    touch.setAttribute('aria-pressed', String(active));
  });
})();
</script>
